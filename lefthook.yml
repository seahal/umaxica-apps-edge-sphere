pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{js,jsx,ts,tsx,json,jsonc,yaml,yml,md,mdx}"
      run: pnpm exec vp fmt --write {staged_files}
      stage_fixed: true
    lint:
      glob: "*.{js,jsx,ts,tsx}"
      run: pnpm exec vp lint {staged_files}
    spelling:
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,json,jsonc,yaml,yml,md,css}"
      run: pnpm exec cspell lint --no-progress --no-must-find-files {staged_files}
    deps:
      glob: "{package.json,pnpm-workspace.yaml,*/*/package.json}"
      run: pnpm run check:deps

# Whole-package type-aware lint and the remaining gates run before a push.
# Checks are sequential and stop at the first failure.
pre-push:
  piped: true
  commands:
    deps:
      priority: 1
      run: pnpm run check:deps
    architecture:
      priority: 2
      run: pnpm run check:architecture
    knip:
      priority: 3
      run: pnpm run knip
    spelling:
      priority: 4
      run: pnpm run check:spelling
    lint-check:
      priority: 5
      run: pnpm run lint:check
    typecheck:
      priority: 6
      run: pnpm run typecheck
    test:
      priority: 7
      run: pnpm run test
